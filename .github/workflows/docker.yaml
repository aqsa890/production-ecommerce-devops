name: Docker Build

on:
  workflow_call:

jobs:
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/novastore-be:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/novastore-be:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/novastore-be:v1.0.0

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/novastore-fe:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/novastore-fe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/novastore-fe:v1.0.0

      - name: Save Docker Images for Trivy & Push
        run: |
          mkdir -p image-artifacts
          docker save -o image-artifacts/be-image.tar ${{ secrets.DOCKERHUB_USERNAME }}/novastore-be:${{ github.sha }}
          docker save -o image-artifacts/fe-image.tar ${{ secrets.DOCKERHUB_USERNAME }}/novastore-fe:${{ github.sha }}

      - name: Upload Built Images Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-docker-images
          path: image-artifacts/
          retention-days: 1
