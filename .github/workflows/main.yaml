name: Main CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # =========================================================================
  # Phase 1: Parallel Baseline Validation (Gitleaks, SCA, Testing, Linting)
  # =========================================================================
  gitleaks:
    name: 1a. Gitleaks (Secrets Scan)
    uses: ./.github/workflows/gitleaks.yaml
    secrets: inherit

  sca:
    name: 1b. SCA (Snyk Dependency Scan)
    uses: ./.github/workflows/sca.yaml
    secrets: inherit

  testing:
    name: 1c. Testing (Node.js Test Runner)
    uses: ./.github/workflows/testing.yaml
    secrets: inherit

  linting:
    name: 1d. Linting (Syntax & Code Validation)
    uses: ./.github/workflows/linting.yaml
    secrets: inherit

  # =========================================================================
  # Phase 2: Parallel Deep Security & Code Quality Analysis
  # =========================================================================
  codeql:
    name: 2a. SAST (CodeQL Analysis)
    uses: ./.github/workflows/codeql.yaml
    secrets: inherit
    needs: [gitleaks, sca, testing, linting]

  sonarqube:
    name: 2b. SonarQube (Quality Gate)
    uses: ./.github/workflows/sonarqube.yaml
    secrets: inherit
    needs: [gitleaks, sca, testing, linting]

  hadolint:
    name: 2c. Hadolint (Dockerfile Linting)
    uses: ./.github/workflows/hadolint.yaml
    secrets: inherit
    needs: [gitleaks, sca, testing, linting]

  # =========================================================================
  # Phase 3: Container Build, Trivy Security Scan & Docker Push
  # =========================================================================
  docker-build:
    name: 3a. Docker Build
    uses: ./.github/workflows/docker.yaml
    secrets: inherit
    needs: [codeql, sonarqube, hadolint]

  trivy-image:
    name: 3b. Trivy (Image Vulnerability Scan)
    uses: ./.github/workflows/trivy-image.yaml
    secrets: inherit
    needs: [docker-build]

  docker-push:
    name: 3c. Docker Push
    uses: ./.github/workflows/docker-push.yaml
    secrets: inherit
    needs: [trivy-image]

  # =========================================================================
  # Phase 4: Staging Deployment, K8s Verification & Production EC2 Deploy
  # =========================================================================
  rollback-k8s:
    name: 4a. Rollback K8s (Deploy & Verify)
    uses: ./.github/workflows/rollback-k8s.yaml
    secrets: inherit
    needs: [docker-push]

  deploy-ec2:
    name: 4b. Deploy on EC2 (Live Diagnostics & Rollback)
    uses: ./.github/workflows/deploy-ec2.yaml
    secrets: inherit
    needs: [rollback-k8s]
