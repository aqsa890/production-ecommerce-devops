name: Main CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # =========================================================================
  # Tier 1: Fast Parallel Baseline Scans (Triggered instantly at t=0)
  # =========================================================================
  gitleaks:
    name: 1a. Gitleaks (Secrets)
    uses: ./.github/workflows/gitleaks.yaml
    secrets: inherit

  sca:
    name: 1b. SCA (Snyk Scan)
    uses: ./.github/workflows/sca.yaml
    secrets: inherit

  testing:
    name: 1c. Testing (Unit & Integration)
    uses: ./.github/workflows/testing.yaml
    secrets: inherit

  linting:
    name: 1d. Linting (Syntax Check)
    uses: ./.github/workflows/linting.yaml
    secrets: inherit

  hadolint:
    name: 1e. Hadolint (Dockerfiles)
    uses: ./.github/workflows/hadolint.yaml
    secrets: inherit

  # =========================================================================
  # Tier 2: Deep Security Analysis & Early Container Build (Run in Parallel)
  # =========================================================================
  codeql:
    name: 2a. SAST (CodeQL Analysis)
    uses: ./.github/workflows/codeql.yaml
    secrets: inherit
    needs: [testing, linting]

  sonarqube:
    name: 2b. SonarQube (Quality Gate)
    uses: ./.github/workflows/sonarqube.yaml
    secrets: inherit
    needs: [testing, linting]

  # Docker build starts immediately as soon as unit tests + linters pass!
  docker-build:
    name: 2c. Docker Build (be & fe)
    uses: ./.github/workflows/docker.yaml
    secrets: inherit
    needs: [testing, linting, hadolint]

  # =========================================================================
  # Tier 3: Container Vulnerability Scan & Unified Security Gating for Push
  # =========================================================================
  trivy-image:
    name: 3a. Trivy (Image CVE Scan)
    uses: ./.github/workflows/trivy-image.yaml
    secrets: inherit
    needs: [docker-build]

  # Docker push acts as the security synchronization gate:
  # Requires Trivy, CodeQL, SonarQube, Gitleaks & SCA all to be green!
  docker-push:
    name: 3b. Docker Push (SHA + latest)
    uses: ./.github/workflows/docker-push.yaml
    secrets: inherit
    needs: [trivy-image, codeql, sonarqube, gitleaks, sca]

  # =========================================================================
  # Tier 4: Kubernetes Staging Verification & Production EC2 Deployment
  # =========================================================================
  rollback-k8s:
    name: 4a. Rollback K8s (Deploy & Verify)
    uses: ./.github/workflows/rollback-k8s.yaml
    secrets: inherit
    needs: [docker-push]

  deploy-ec2:
    name: 4b. Deploy on EC2 (Live Diagnostics & Auto-Rollback)
    uses: ./.github/workflows/deploy-ec2.yaml
    secrets: inherit
    needs: [rollback-k8s]
