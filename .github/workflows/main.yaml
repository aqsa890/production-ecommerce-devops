name: Main CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # Stage 1: Secrets Scanning
  gitleaks:
    name: 1. Gitleaks
    uses: ./.github/workflows/gitleaks.yaml
    secrets: inherit

  # Stage 2a: Linting
  linting:
    name: 2a. Linting
    uses: ./.github/workflows/linting.yaml
    secrets: inherit
    needs: [gitleaks]

  # Stage 2b: Testing
  testing:
    name: 2b. Testing
    uses: ./.github/workflows/testing.yaml
    secrets: inherit
    needs: [linting]

  # Stage 3: SAST (Static Application Security Testing)
  codeql:
    name: 3. SAST (CodeQL)
    uses: ./.github/workflows/codeql.yaml
    secrets: inherit
    needs: [testing]

  # Stage 4a: SCA (Software Composition Analysis)
  sca:
    name: 4a. SCA (Snyk)
    uses: ./.github/workflows/sca.yaml
    secrets: inherit
    needs: [codeql]

  # Stage 4b: SonarQube Code Quality & Security Scan
  sonarqube:
    name: 4b. SonarQube
    uses: ./.github/workflows/sonarqube.yaml
    secrets: inherit
    needs: [sca]

  # Stage 5: Hadolint Dockerfile Linter
  hadolint:
    name: 5. Hadolint
    uses: ./.github/workflows/hadolint.yaml
    secrets: inherit
    needs: [sonarqube]

  # Stage 6: Multi-Tier Docker Image Build
  docker-build:
    name: 6. Docker Build
    uses: ./.github/workflows/docker.yaml
    secrets: inherit
    needs: [hadolint]

  # Stage 7: Trivy Container Vulnerability Scan
  trivy-image:
    name: 7. Trivy
    uses: ./.github/workflows/trivy-image.yaml
    secrets: inherit
    needs: [docker-build]

  # Stage 8: Docker Hub Registry Push
  docker-push:
    name: 8. Docker Push
    uses: ./.github/workflows/docker-push.yaml
    secrets: inherit
    needs: [trivy-image]

  # Stage 9: Kubernetes Staging Deploy & Automated Rollback
  rollback-k8s:
    name: 9. Rollback K8s
    uses: ./.github/workflows/rollback-k8s.yaml
    secrets: inherit
    needs: [docker-push]

  # Stage 10: Production EC2 Deployment & Live Diagnostics
  deploy-ec2:
    name: 10. Deploy on EC2
    uses: ./.github/workflows/deploy-ec2.yaml
    secrets: inherit
    needs: [rollback-k8s]
