name: Deploy on EC2

on:
  workflow_call:

jobs:
  deploy-ec2:
    name: Deploy to KinD Kubernetes on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Kubernetes Manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/*"
          target: "/home/${{ secrets.EC2_USERNAME }}/novastore-app/"

      - name: Deploy and Verify on KinD Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,IMAGE_TAG
          script: |
            set -e
            NAMESPACE="novestore-ns"
            BE_IMAGE="${DOCKERHUB_USERNAME}/novastore-be:${IMAGE_TAG}"
            FE_IMAGE="${DOCKERHUB_USERNAME}/novastore-fe:${IMAGE_TAG}"

            echo "=== Navigating to Manifests Directory ==="
            cd /home/${{ secrets.EC2_USERNAME }}/novastore-app

            echo "=== Checking KinD / Kubectl Cluster Health on EC2 ==="
            kubectl cluster-info

            echo "=== Applying Base Configurations & Namespace ==="
            kubectl apply -f k8s/namespace.yml
            kubectl apply -f k8s/config-map.yml
            kubectl apply -f k8s/postgres-storage.yml
            kubectl apply -f k8s/postgress-svc.yml
            kubectl apply -f k8s/postgress-dep.yml
            kubectl apply -f k8s/backend-svc.yml
            kubectl apply -f k8s/frontend-svc.yml
            kubectl apply -f k8s/hpa.yml

            echo "=== Applying Workload Deployments ==="
            kubectl apply -f k8s/backend-dep.yml
            kubectl apply -f k8s/frontend-dep.yml

            echo "=== Updating Container Images to: $IMAGE_TAG ==="
            kubectl set image deployment/backend-deployment backend=$BE_IMAGE -n $NAMESPACE
            kubectl set image deployment/frontend-deployment frontend=$FE_IMAGE -n $NAMESPACE

            echo "=== Monitoring Rollout Status (with Auto-Rollback) ==="
            if ! kubectl rollout status deployment/backend-deployment -n $NAMESPACE --timeout=120s; then
              echo "❌ Backend rollout failed! Executing automatic rollback..."
              kubectl rollout undo deployment/backend-deployment -n $NAMESPACE
              kubectl get pods -n $NAMESPACE
              kubectl describe deployment/backend-deployment -n $NAMESPACE
              exit 1
            fi

            if ! kubectl rollout status deployment/frontend-deployment -n $NAMESPACE --timeout=120s; then
              echo "❌ Frontend rollout failed! Executing automatic rollback..."
              kubectl rollout undo deployment/frontend-deployment -n $NAMESPACE
              kubectl get pods -n $NAMESPACE
              kubectl describe deployment/frontend-deployment -n $NAMESPACE
              exit 1
            fi

            echo "=== Ensuring Background Port Forwarding for External Access ==="
            # Kill any prior port-forward
            pkill -f "kubectl port-forward" || true
            sleep 1
            # Run background port-forward on port 80/3000 to allow public web access to the KinD cluster
            nohup kubectl port-forward -n $NAMESPACE svc/frontend-service 80:80 --address 0.0.0.0 > /tmp/k8s-portforward-80.log 2>&1 &
            nohup kubectl port-forward -n $NAMESPACE svc/frontend-service 3000:80 --address 0.0.0.0 > /tmp/k8s-portforward-3000.log 2>&1 &
            sleep 3

            echo "=== Current Pods, Services & HPA in $NAMESPACE ==="
            kubectl get pods,svc,hpa -n $NAMESPACE

            echo "🎉 Kubernetes deployment on EC2 KinD cluster completed and verified successfully!"
